<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002652">
<title>ALBA – Przejazdy prywatne</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Przejazdy">
<script src="xlsx.full.min.js" defer></script>
<style>
:root{
  --navy:#002652; --navy-dark:#1A2332; --cyan:#009FE3; --green:#3FA535; --gray:#5E6B80;
  --warn:#F7A600; --alert:#E40051;
  --bg:#F7F9FC; --surface:#FFFFFF; --text:#002652; --text2:#5E6B80; --line:#E1E7EF;
  --header:#002652; --field:#FFFFFF; --odo:#002652; --odo-last:#009FE3;
  --ok-bg:#E8F5EE; --warn-bg:#FFF4E0; --info-bg:#E8ECF1; --chip:#E1E7EF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A2332; --surface:#002652; --text:#FFFFFF; --text2:#8AA3CC; --line:rgba(255,255,255,.14);
    --header:#002652; --field:#1A2332; --odo:#1A2332; --odo-last:#009FE3;
    --ok-bg:rgba(63,165,53,.18); --warn-bg:rgba(247,166,0,.16); --info-bg:rgba(255,255,255,.07); --chip:rgba(255,255,255,.1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A2332; --surface:#002652; --text:#FFFFFF; --text2:#8AA3CC; --line:rgba(255,255,255,.14);
  --header:#002652; --field:#1A2332; --odo:#1A2332; --odo-last:#009FE3;
  --ok-bg:rgba(63,165,53,.18); --warn-bg:rgba(247,166,0,.16); --info-bg:rgba(255,255,255,.07); --chip:rgba(255,255,255,.1);
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Arial,"Helvetica Neue",Helvetica,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--header);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.top-in{display:flex;align-items:center;gap:14px;max-width:1100px;margin:0 auto;padding:10px 16px}
.top img{width:104px;height:auto;display:block}
.top .ttl{font-weight:700;font-size:15px;line-height:1.2;border-left:1px solid rgba(255,255,255,.3);padding-left:14px}
.top .ttl small{display:block;font-weight:400;color:#A8DCF0;font-size:12px}
.top .me{margin-left:auto;display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;cursor:pointer;padding:4px;border-radius:24px}
.av{width:34px;height:34px;border-radius:50%;background:var(--cyan);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me .nm{font-size:13px;text-align:right;line-height:1.2}
.me .nm small{display:block;color:#A8DCF0;font-size:11px}
@media (max-width:560px){.me .nm{display:none}.top .ttl small{display:none}}

main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
main.wide{max-width:1100px;padding-bottom:48px}
h1{font-size:22px;margin:4px 0 14px;line-height:1.25}
h2{font-size:16px;margin:26px 0 10px}
.muted{color:var(--text2)}
.small{font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card + .card{margin-top:12px}

/* vehicle + odometer */
.veh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.veh-model{font-weight:700;font-size:17px}
.plate{display:inline-block;font-weight:700;letter-spacing:.06em;border:2px solid var(--text);border-radius:5px;padding:2px 8px;font-size:14px;white-space:nowrap}
.odo-wrap{margin:16px 0 6px}
.odo{display:inline-flex;gap:3px;align-items:stretch}
.odo span{position:relative;width:32px;height:46px;border-radius:5px;background:var(--odo);color:#fff;display:grid;place-items:center;font-weight:700;font-size:27px;font-variant-numeric:tabular-nums;overflow:hidden;
  box-shadow:inset 0 10px 10px -6px rgba(0,0,0,.45),inset 0 -10px 10px -6px rgba(0,0,0,.45)}
.odo span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.12)}
.odo span:nth-last-child(2){background:var(--odo-last)}
.odo .unit{background:none;box-shadow:none;color:var(--text);font-size:15px;width:auto;padding-left:6px;align-self:end}
.odo .unit::after{display:none}
.odo.sm span{width:22px;height:32px;font-size:18px;border-radius:4px}
.odo.sm .unit{font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin-top:12px}
.kv dt{color:var(--text2)}
.kv dd{margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn-primary{background:var(--cyan)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{background:var(--cyan)}}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn-ok{background:var(--green);color:#fff}
.btn-danger{background:transparent;border-color:var(--alert);color:var(--alert)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:8px}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.big-actions .btn{flex-direction:column;padding:16px 10px;min-height:92px;font-size:15px}
.big-actions .btn svg{width:28px;height:28px}

/* balance */
.bal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.bal .sum{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict{margin-top:12px;border-radius:10px;padding:12px 14px;font-weight:700;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.verdict.due{background:var(--warn-bg);border-left:4px solid var(--warn)}
.verdict.ok{background:var(--ok-bg);border-left:4px solid var(--green)}
.verdict .v{font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* lists */
.entry{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--chip);color:var(--text)}
.ico svg{width:20px;height:20px}
.entry .t{font-weight:700}
.entry .s{font-size:13px;color:var(--text2)}
.entry .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.comment{font-size:13px;margin-top:6px;padding:6px 10px;border-left:3px solid var(--alert);background:var(--info-bg);border-radius:0 6px 6px 0}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;margin-top:4px;color:#fff;white-space:nowrap}
.p-Zgłoszony,.p-Zgłoszone{background:var(--warn);color:#002652}
.p-Zaakceptowany,.p-Zaakceptowane{background:var(--cyan)}
.p-Rozliczony,.p-Rozliczone{background:var(--green)}
.p-Zapisany{background:var(--cyan)}
.remind{display:flex;justify-content:space-between;align-items:center;gap:10px}
.veh-acts{margin-top:12px}
.supp{margin-top:12px;border-left:3px solid var(--cyan)}
.sec{margin:20px 0 6px;font-size:15px}
.flag{color:var(--alert);font-weight:700}
td.hl{background:var(--warn-bg)!important;font-weight:700}
.p-Odrzucony,.p-Odrzucone{background:var(--alert)}
.p-late{background:var(--chip);color:var(--text)}
.period-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px}
.period-h h2{margin:0}
.empty{padding:26px 16px;text-align:center;color:var(--text2)}

/* forms */
.field{margin-top:14px}
.field label,.lbl{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.field .hint{font-size:12px;color:var(--text2);margin-top:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:11px 12px;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(0,159,227,.25)}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{margin-top:16px;border-radius:12px;padding:14px;background:var(--info-bg);display:flex;justify-content:space-between;align-items:center;gap:12px}
.preview .km{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.preview .l{text-align:right;font-size:13px;color:var(--text2)}
.preview .l b{display:block;font-size:18px;color:var(--text)}
.msg{margin-top:10px;border-radius:9px;padding:10px 12px;font-size:13px}
.msg.err{background:var(--info-bg);border-left:4px solid var(--alert)}
.msg.warn{background:var(--warn-bg);border-left:4px solid var(--warn)}
.msg.info{background:var(--info-bg);border-left:4px solid var(--cyan)}
.photo-pick{display:flex;align-items:center;gap:12px;border:1px dashed var(--text2);border-radius:10px;padding:12px;cursor:pointer}
.photo-pick svg{width:26px;height:26px;flex:none}
.photo-pick img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.form-actions{display:flex;gap:10px;margin-top:20px}
.form-actions .btn{flex:1}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text2);cursor:pointer;min-height:56px}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--text);font-weight:700}
.nav button[aria-current="page"] svg{color:var(--cyan)}

/* admin */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--cyan)}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pnav{display:flex;align-items:center;gap:6px}
.pnav button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.pnav button[disabled]{opacity:.35;cursor:default}
.pnav .pn{font-size:20px;font-weight:700;min-width:190px;text-align:center}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px}
.status.open{background:var(--warn-bg)}
.status.closed{background:var(--ok-bg)}
.pbar .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:10px;padding:12px 14px}
:root[data-theme="dark"] .kpi{border-left-color:#A8DCF0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi{border-left-color:#A8DCF0}}
.kpi.c{border-left-color:var(--cyan)} .kpi.g{border-left-color:var(--green)} .kpi.o{border-left-color:var(--warn)}
.kpi .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--text2)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;font-weight:700;padding:10px;white-space:nowrap}
th.n,td.n{text-align:right}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:var(--info-bg)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--chip)}
td .who{font-weight:700}
.neg{color:var(--green);font-weight:700}
.pos{color:#B87A00;font-weight:700}
:root[data-theme="dark"] .pos{color:var(--warn)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pos{color:var(--warn)}}
.badge{display:inline-block;min-width:22px;text-align:center;font-weight:700;border-radius:11px;padding:2px 7px;background:var(--warn);color:#002652;font-size:12px}
.note{font-size:12px;color:var(--text2);margin-top:10px}

/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,20,45,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.modal{background:var(--surface);color:var(--text);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{border-radius:16px}}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .x{float:right;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--text2);padding:2px 6px}
.ent-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{display:block;margin-top:8px;border:0;padding:0;background:none;cursor:zoom-in}
.thumb img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumb.open img{width:100%;height:auto;max-height:460px;object-fit:contain;cursor:zoom-out}
.acct{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;margin-top:8px}
.acct .role{margin-left:auto;font-size:12px;color:var(--text2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:700}

/* login */
.login{min-height:100vh;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.login-in{width:100%;max-width:400px}
.login img{width:150px}
.login h1{font-size:28px;margin:34px 0 8px}
.login p{color:#A8DCF0;margin:0 0 26px}
.ms{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#002652;border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer;min-height:48px}
.ms i{display:grid;grid-template-columns:8px 8px;gap:2px}
.ms i b{width:8px;height:8px;background:#002652}
.ms i b:nth-child(2){background:#009FE3}.ms i b:nth-child(3){background:#3FA535}.ms i b:nth-child(4){background:#5E6B80}
.login .acct{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:#fff}
.login .acct .role{color:#A8DCF0}
.proto{font-size:12px;color:#A8DCF0;margin-top:26px;line-height:1.5}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font-size:inherit}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--navy-dark);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);border-left:4px solid var(--green)}
.toast.alert{border-left-color:var(--alert)}
.upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:25;max-width:560px;margin:0 auto;background:var(--navy-dark);color:#fff;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-left:4px solid var(--cyan);font-size:14px}
.inst{margin-top:14px}
.login .inst .note{color:#A8DCF0}
.login .inst .btn{width:100%;background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>
<div id="upd" aria-live="polite"></div>

/* ---------- pomocnicze ---------- */
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const pad = n => String(n).padStart(2,'0');
const today = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const per = d => d.slice(0,7);
const nextP = p => { let [y,m] = p.split('-').map(Number); m++; if(m>12){m=1;y++;} return y+'-'+pad(m); };
const prevP = p => { let [y,m] = p.split('-').map(Number); m--; if(m<1){m=12;y--;} return y+'-'+pad(m); };
const pName = p => { const [y,m] = p.split('-'); return MONTHS[+m-1]+' '+y; };
const fDate = d => d ? d.split('-').reverse().join('.') : '';
const fKm = n => (n==null||isNaN(n)) ? '—' : Math.round(n).toLocaleString('pl-PL');
const fL = n => (Math.abs(n) < 0.005 ? 0 : n).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const userBy = id => S.users.find(u => u.id === id);
const veh = id => S.vehicles.find(v => v.id === id);
const lastDay = p => { const [y,m] = p.split('-').map(Number); return p+'-'+pad(new Date(y,m,0).getDate()); };
const readingFor = (p,v) => S.readings.find(r => r.okres===p && r.vehicleId===v);
const me = () => userBy(S.session);
const initials = n => n.split(' ').map(x=>x[0]).join('').slice(0,2);
const sum = (a,f) => a.reduce((s,x)=>s+f(x),0);
const $ = s => document.querySelector(s);

const lastClosed = () => S.closed.slice().sort().pop();
const firstOpen = () => nextP(lastClosed());
const isClosed = p => S.closed.includes(p);
const okresFor = date => { const p = per(date), fo = firstOpen(); return p < fo ? {okres:fo, late:true} : {okres:p, late:false}; };

const ST_TRIP_LIVE = ['Zgłoszony','Zaakceptowany','Rozliczony'];
const ST_FUEL_LIVE = ['Zgłoszone','Zaakceptowane','Rozliczone'];
const ST_TRIP_ACC = ['Zaakceptowany','Rozliczony'];
const ST_FUEL_ACC = ['Zaakceptowane','Rozliczone'];

function calcPair(u, v, p, mode){
  const ts = mode==='accepted' ? ST_TRIP_ACC : ST_TRIP_LIVE;
  const fs = mode==='accepted' ? ST_FUEL_ACC : ST_FUEL_LIVE;
  const allT = S.trips.filter(t => t.userId===u && t.vehicleId===v && t.okres===p);
  const allF = S.fuels.filter(f => f.userId===u && f.vehicleId===v && f.okres===p);
  const trips = allT.filter(t => ts.includes(t.status));
  const fuels = allF.filter(f => fs.includes(f.status));
  const vh = veh(v);
  const km = sum(trips, t => t.km);
  const nal = r2(km * vh.norma / 100);
  const zat = r2(sum(fuels, f => f.litry));
  const przen = carry(u, v, p, mode);
  return {
    userId:u, vehicleId:v, okres:p, km, norma:vh.norma, litryNalezne:nal, litryZatankowane:zat,
    saldoPrzen:przen, saldoKon:r2(przen + nal - zat),
    licznikStart: trips.some(t=>t.start!=null) ? Math.min(...trips.filter(t=>t.start!=null).map(t=>t.start)) : null,
    licznikEnd: trips.some(t=>t.end!=null) ? Math.max(...trips.filter(t=>t.end!=null).map(t=>t.end)) : null,
    licznikMiesiac: readingFor(p, v) ? readingFor(p, v).licznik : null,
    pending: allT.filter(t=>t.status==='Zgłoszony').length + allF.filter(f=>f.status==='Zgłoszone').length,
    allT, allF
  };
}
function carry(u, v, p, mode){
  const pp = prevP(p);
  const s = S.settlements.find(x => x.okres===pp && x.userId===u && x.vehicleId===v);
  if(s) return s.saldoKon;
  if(pp < firstOpen()) return 0;
  return calcPair(u, v, pp, mode).saldoKon;
}
function pairsFor(p){
  if(isClosed(p)) return S.settlements.filter(s => s.okres===p).map(s => [s.userId, s.vehicleId]);
  const keys = new Set();
  S.trips.concat(S.fuels, S.readings).forEach(x => { if(x.okres===p) keys.add(x.userId+'|'+x.vehicleId); });
  const pp = prevP(p);
  if(pp >= firstOpen()){
    pairsFor(pp).forEach(([u,v]) => { if(Math.abs(calcPair(u,v,pp,'live').saldoKon) > 0.004) keys.add(u+'|'+v); });
  } else {
    S.settlements.filter(s => s.okres===pp && Math.abs(s.saldoKon) > 0.004).forEach(s => keys.add(s.userId+'|'+s.vehicleId));
  }
  return [...keys].map(k => k.split('|')).sort((a,b) => userBy(a[0]).name.localeCompare(userBy(b[0]).name,'pl'));
}
function lastOdo(vehicleId, date, all){
  const c = S.trips.filter(t => t.vehicleId===vehicleId && t.status.indexOf('Odrzuc')!==0 && t.end!=null && t.date<=date).map(t => ({end:t.end, date:t.date, kind:'trip'}))
    .concat(S.readings.filter(r => r.vehicleId===vehicleId && (all || lastDay(r.okres) < date)).map(r => ({end:r.licznik, date:lastDay(r.okres), kind:'odo', okres:r.okres})));
  c.sort((a,b) => b.end - a.end);
  return c[0] || null;
}
function missingReadings(p){
  const ld = lastDay(p);
  return S.assignments.filter(a => a.od<=ld && (!a.do || a.do>=ld) && !readingFor(p, a.vehicleId)).map(a => ({u:a.userId, v:a.vehicleId}));
}
function readingCheck(vehicleId, p, val){
  const ld = lastDay(p), errs = [];
  const tr = S.trips.filter(t => t.vehicleId===vehicleId && t.status!=='Odrzucony' && t.start!=null);
  const before = tr.filter(t => t.date<=ld).sort((a,b) => b.end-a.end)[0];
  const after = tr.filter(t => t.date>ld).sort((a,b) => a.start-b.start)[0];
  const others = S.readings.filter(r => r.vehicleId===vehicleId && r.okres!==p);
  const pr = others.filter(r => r.okres<p).sort((a,b) => b.licznik-a.licznik)[0];
  const nx = others.filter(r => r.okres>p).sort((a,b) => a.licznik-b.licznik)[0];
  if(before && val < before.end) errs.push(`Stan jest niższy niż licznik po przejeździe z ${fDate(before.date)} (${fKm(before.end)} km).`);
  else if(after && val > after.start) errs.push(`Stan przekracza licznik na starcie przejazdu z ${fDate(after.date)} (${fKm(after.start)} km).`);
  else if(pr && val < pr.licznik) errs.push(`Stan jest niższy niż odczyt za ${pName(pr.okres)} (${fKm(pr.licznik)} km).`);
  else if(nx && val > nx.licznik) errs.push(`Stan przekracza odczyt za ${pName(nx.okres)} (${fKm(nx.licznik)} km).`);
  return errs;
}
function tripCheck(vehicleId, date, start, end){
  const errs = [];
  if(isNaN(start) || isNaN(end)) return errs;
  if(!(end > start)){ errs.push('Licznik końcowy musi być większy od początkowego.'); return errs; }
  const list = S.trips.filter(t => t.vehicleId===vehicleId && t.status!=='Odrzucony' && t.start!=null);
  for(const t of list){
    if(start < t.end && end > t.start){ errs.push(`Przebieg ${fKm(start)}–${fKm(end)} km nachodzi na przejazd z ${fDate(t.date)} (${fKm(t.start)}–${fKm(t.end)} km).`); break; }
    if(t.date < date && t.end > start){ errs.push(`Licznik początkowy jest niższy niż stan po przejeździe z ${fDate(t.date)} (${fKm(t.end)} km).`); break; }
    if(t.date > date && t.start < end){ errs.push(`Licznik końcowy przekracza stan z późniejszego przejazdu z ${fDate(t.date)} (${fKm(t.start)} km).`); break; }
  }
  if(!errs.length){
    for(const r of S.readings.filter(r => r.vehicleId===vehicleId)){
      const ld = lastDay(r.okres);
      if(ld < date && start < r.licznik){ errs.push(`Licznik początkowy jest niższy niż stan na koniec miesiąca z ${fDate(ld)} (${fKm(r.licznik)} km).`); break; }
      if(ld >= date && end > r.licznik){ errs.push(`Licznik końcowy przekracza stan na koniec miesiąca z ${fDate(ld)} (${fKm(r.licznik)} km).`); break; }
    }
  }
  return errs;
}

function compressImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.6));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function myPairsOpen(u){
  const res = [];
  const tp = per(today());
  let p = firstOpen();
  const end = tp > p ? tp : p;
  const cur = vehiclesFor(u.id, today()).map(v => v.id);
  for(;;){
    const pairs = pairsFor(p).filter(([uu]) => uu===u.id).map(x => x[1]);
    const vs = new Set(pairs);
    if(p===end) cur.forEach(v => vs.add(v));
    vs.forEach(v => res.push(calcPair(u.id, v, p, 'live')));
    if(p===end) break;
    p = nextP(p);
  }
  return res;
}

function myEntries(userId){

  return a.sort((x,y) => y.date.localeCompare(x.date) || (y.kind==='trip') - (x.kind==='trip'));

function entryRow(e, opts){

/* ---- stan licznika na koniec miesiąca ---- */
/* dni robocze (weekendy i święta ustawowe w Polsce) */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(Date.UTC(y,mo-1,da,12)); }
const isoUTC = dt => dt.toISOString().slice(0,10);
const addDay = (ds, n) => { const dt = new Date(ds+'T12:00:00Z'); dt.setUTCDate(dt.getUTCDate()+n); return isoUTC(dt); };
function holidays(y){
  const e = isoUTC(easter(y));
  return new Set([`${y}-01-01`,`${y}-01-06`,e,addDay(e,1),addDay(e,49),addDay(e,60),`${y}-05-01`,`${y}-05-03`,`${y}-08-15`,`${y}-11-01`,`${y}-11-11`,`${y}-12-24`,`${y}-12-25`,`${y}-12-26`]);
}
function isWorkday(ds){ const wd = new Date(ds+'T12:00:00Z').getUTCDay(); return wd!==0 && wd!==6 && !holidays(+ds.slice(0,4)).has(ds); }
function firstWorkday(p){ let d = p+'-01'; while(!isWorkday(d)) d = addDay(d,1); return d; }
function reminderDate(p){ let d = addDay(firstWorkday(nextP(p)),1); while(!isWorkday(d)) d = addDay(d,1); return d; }
const odoDeadline = p => firstWorkday(nextP(p));
/* okno podawania stanu: od 3 dni przed końcem miesiąca do końca miesiąca następnego */
function odoWindow(p){
  const tp = per(today());
  if(p===prevP(tp)) return true;
  if(p===tp) return Number(today().slice(8)) >= Number(lastDay(p).slice(8)) - 3;
  return false;
}
function odoPeriods(){ const tp = per(today()); return [prevP(tp), tp].filter(odoWindow); }
function viewOdo(){
  const ps = odoPeriods(), pre = U.odoPreset || {};
  const miss = ps.find(p => missingReadings(p).some(x => x.u===S.session));
  const defP = pre.p && ps.includes(pre.p) ? pre.p : (miss || ps[ps.length-1]);
  return `<h1>Stan licznika na koniec miesiąca</h1>
  <p class="muted small" style="margin-top:-6px">Podaj odczyt licznika z ostatniego dnia miesiąca. Rozliczający porównuje go z przejazdami prywatnymi.</p>

    </div>
    <div class="field"><label for="o-val">Stan licznika na dzień <span id="o-day"></span></label><input type="number" inputmode="numeric" id="o-val" min="0" step="1" placeholder="km"><div class="hint" id="o-hint"></div></div>

  </div>`;
}

function usersOfVehicle(vid, p){
  const fd = p+'-01', ld = lastDay(p);
  return S.assignments.filter(a => a.vehicleId===vid && a.od<=ld && (!a.do || a.do>=fd)).sort((a,b)=>a.od.localeCompare(b.od))
    .map(a => ({u:userBy(a.userId), txt: userBy(a.userId).name + (a.od>fd ? ` od ${fDate(a.od)}` : '') + (a.do && a.do<ld ? ` do ${fDate(a.do)}` : '')}));
}
function vehReport(vid, p){
  const v = veh(vid);
  const rs = readingFor(prevP(p), vid), re = readingFor(p, vid);
  const trips = S.trips.filter(t => t.vehicleId===vid && t.okres===p && t.status!=='Odrzucony');
  const fuels = S.fuels.filter(f => f.vehicleId===vid && f.okres===p && f.status!=='Odrzucone');
  const kmZgl = sum(trips.filter(t=>!t.manual), t=>t.km), kmUzup = sum(trips.filter(t=>t.manual), t=>t.km);
  const lZgl = r2(sum(fuels.filter(f=>!f.manual), f=>f.litry)), lUzup = r2(sum(fuels.filter(f=>f.manual), f=>f.litry));
  const start = rs ? rs.licznik : null, end = re ? re.licznik : null;
  const przebieg = (start!=null && end!=null) ? end - start : null;
  const kmPryw = kmZgl + kmUzup;
  return {v, start, end, przebieg, kmZgl, kmUzup, kmPryw, sluzb: przebieg!=null ? przebieg - kmPryw : null,
    udzial: przebieg ? kmPryw / przebieg : null, nal: r2(kmPryw * v.norma / 100), lZgl, lUzup, lRazem: r2(lZgl + lUzup),
    ver: verifFor(p, vid), users: usersOfVehicle(vid, p)};
}
const fPct = x => x==null ? '—' : (x*100).toLocaleString('pl-PL',{maximumFractionDigits:1}) + '%';
function viewReport(){
  const seg = `<div class="seg" role="group" aria-label="Zakres raportu" style="margin-bottom:16px"><button data-a="rmode" data-m="month" aria-pressed="${U.rmode!=='range'}">Miesiąc</button><button data-a="rmode" data-m="range" aria-pressed="${U.rmode==='range'}">Dowolny zakres dat</button></div>`;
  return seg + (U.rmode==='range' ? viewRange() : viewReportMonth());
}

function rangeDefaults(){ if(!U.rfrom){ U.rfrom = per(today())+'-01'; U.rto = today(); } if(!U.rst) U.rst = 'all'; }
function rangePreset(k){
  const t = today(), tp = per(t);
  if(k==='cur'){ U.rfrom = tp+'-01'; U.rto = t; }
  if(k==='prev'){ const p = prevP(tp); U.rfrom = p+'-01'; U.rto = lastDay(p); }
  if(k==='q'){ const [y,m] = tp.split('-').map(Number); U.rfrom = `${y}-${pad(Math.floor((m-1)/3)*3+1)}-01`; U.rto = t; }
  if(k==='y'){ U.rfrom = tp.slice(0,4)+'-01-01'; U.rto = t; }
}
function odoAt(vid, date){
  const c = S.trips.filter(t => t.vehicleId===vid && t.status!=='Odrzucony' && t.end!=null && t.date<=date).map(t => ({val:t.end, date:t.date}))
    .concat(S.readings.filter(r => r.vehicleId===vid && lastDay(r.okres)<=date).map(r => ({val:r.licznik, date:lastDay(r.okres)})));
  c.sort((a,b) => b.date.localeCompare(a.date) || b.val - a.val);
  return c[0] || null;
}
function rangeData(){
  const from = U.rfrom, to = U.rto, inR = d => d>=from && d<=to;
  const ok = U.rst==='acc' ? x => ['Zaakceptowany','Rozliczony','Zaakceptowane','Rozliczone'].includes(x) : x => x!=='Odrzucony' && x!=='Odrzucone';
  const trips = S.trips.filter(t => inR(t.date) && ok(t.status)).sort((a,b)=>a.date.localeCompare(b.date));
  const fuels = S.fuels.filter(f => inR(f.date) && ok(f.status)).sort((a,b)=>a.date.localeCompare(b.date));
  const pend = S.trips.concat(S.fuels).filter(x => inR(x.date) && (x.status==='Zgłoszony'||x.status==='Zgłoszone')).length;
  const asg = S.assignments.filter(a => a.od<=to && (!a.do || a.do>=from));
  const vids = new Set(asg.map(a => a.vehicleId)); trips.concat(fuels).forEach(x => vids.add(x.vehicleId));
  const before = addDay(from, -1);
  const vrows = [...vids].map(veh).sort((a,b)=>a.nr.localeCompare(b.nr)).map(v => {
    const tv = trips.filter(t => t.vehicleId===v.id), fv = fuels.filter(f => f.vehicleId===v.id);
    const a = odoAt(v.id, before), b = odoAt(v.id, to);
    const przebieg = a && b ? b.val - a.val : null;
    const kmZgl = sum(tv.filter(t=>!t.manual), t=>t.km), kmUzup = sum(tv.filter(t=>t.manual), t=>t.km), kmPryw = kmZgl + kmUzup;
    return {v, a, b, przebieg, exact: !!(a && b && a.date===before && b.date===to), kmZgl, kmUzup, kmPryw,
      sluzb: przebieg!=null ? przebieg - kmPryw : null, udzial: przebieg ? kmPryw/przebieg : null,
      nal: r2(sum(tv, t => t.km*v.norma/100)), lZgl: r2(sum(fv.filter(f=>!f.manual), f=>f.litry)), lUzup: r2(sum(fv.filter(f=>f.manual), f=>f.litry)),
      users: asg.filter(x => x.vehicleId===v.id).sort((x,y)=>x.od.localeCompare(y.od)).map(x => userBy(x.userId).name + (x.od>from ? ` od ${fDate(x.od)}` : '') + (x.do && x.do<to ? ` do ${fDate(x.do)}` : ''))};
  });
  const pk = {};
  trips.concat(fuels).forEach(x => { const k = x.userId+'|'+x.vehicleId; pk[k] = pk[k] || {u:userBy(x.userId), v:veh(x.vehicleId), n:0, km:0, nal:0, zat:0}; });
  trips.forEach(t => { const r = pk[t.userId+'|'+t.vehicleId]; r.n++; r.km += t.km; r.nal += t.km*r.v.norma/100; });
  fuels.forEach(f => { pk[f.userId+'|'+f.vehicleId].zat += f.litry; });
  const prows = Object.values(pk).map(r => ({...r, nal:r2(r.nal), zat:r2(r.zat), diff:r2(r.nal - r.zat)})).sort((a,b)=>a.u.name.localeCompare(b.u.name,'pl') || a.v.nr.localeCompare(b.v.nr));
  return {trips, fuels, pend, vrows, prows};
}

function exportRange(){
  if(!window.XLSX){ toast('Nie wczytano biblioteki do eksportu. Sprawdź połączenie i odśwież stronę.', true); return; }
  rangeDefaults();
  const d = rangeData(), zakres = `${U.rfrom} – ${U.rto}`, wpisy = U.rst==='acc' ? 'tylko zaakceptowane' : 'wszystkie bez odrzuconych';

  d.vrows.forEach(r => pz.push([zakres, wpisy, r.v.nr, r.v.model, r.v.spolka, r.users.join(', '), r.a ? r.a.val : '', r.a ? r.a.date : '', r.b ? r.b.val : '', r.b ? r.b.date : '', r.przebieg ?? '', r.przebieg!=null ? (r.exact ? 'tak' : 'nie') : '', r.kmZgl, r.kmUzup, r.sluzb ?? '', r.udzial!=null ? Math.round(r.udzial*1000)/10 : '', r.v.norma, r.nal, r.lZgl, r.lUzup]));

  const wb = XLSX.utils.book_new();

  add(pz, 'Samochody', [23,22,11,24,8,34,14,14,14,14,12,12,14,14,14,12,10,11,14,14]);
  add(pu, 'Użytkownicy', [23,20,11,10,11,12,13,11]);
  add(t, 'Przejazdy', [11,20,11,12,12,8,34,13,14,24]);
  add(f, 'Tankowania', [11,20,11,8,14,24,30]);
  const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  downloads.save({filename:`ALBA_Raport_${U.rfrom}_${U.rto}.xlsx`, data:new Blob([buf])})
    .then(() => toast('Plik zapisany'))
    .catch(err => { if(err && err.code==='declined') return; toast('Nie udało się zapisać pliku.', true); });

function suppCommon(){
  const p = U.period, fd = p+'-01', ld = lastDay(p);
  const userId = $('#s-user').value, date = $('#s-date').value;
  if(!userId){ toast('Wybierz użytkownika.', true); return null; }
  if(!date || date < fd || date > ld){ toast(`Data musi mieścić się w okresie ${pName(p)}.`, true); return null; }
  return {p, userId, date, source:$('#s-src').value};
}
function suppTrip(){
  const c = suppCommon(); if(!c) return;
  const vid = U.modal.v;
  const s = parseInt($('#s-start').value,10), e = parseInt($('#s-end').value,10);
  let km = parseInt($('#s-km').value,10), start = null, end = null;
  if(isNaN(s) !== isNaN(e)){ toast('Podaj oba stany licznika albo żaden.', true); return; }
  if(!isNaN(s)){
    const errs = tripCheck(vid, c.date, s, e);
    if(errs.length){ toast(errs[0], true); return; }
    start = s; end = e; km = e - s;
  }
  if(isNaN(km) || km <= 0){ toast('Podaj liczbę kilometrów.', true); return; }
  const trasa = $('#s-trasa').value.trim();
  if(!trasa){ toast('Wpisz trasę lub opis przejazdu.', true); return; }
  S.trips.push({id:uid(), date:c.date, vehicleId:vid, userId:c.userId, start, end, km, trasa, photo:null, okres:c.p, status:'Zaakceptowany', comment:'', late:false, manual:true, source:c.source, addedBy:S.session});
  U.supp = null; save(); render(); toast('Przejazd uzupełniony');
}
function suppFuel(){
  const c = suppCommon(); if(!c) return;
  const v = veh(U.modal.v), l = parseFloat(($('#s-litry').value||'').replace(',','.'));
  if(isNaN(l) || l <= 0){ toast('Podaj liczbę litrów.', true); return; }
  if(l > v.zbiornik){ toast(`Pojemność zbiornika tego samochodu to ${v.zbiornik} l.`, true); return; }
  S.fuels.push({id:uid(), date:c.date, vehicleId:v.id, userId:c.userId, litry:r2(l), photo:null, okres:c.p, status:'Zaakceptowane', comment:'', late:false, manual:true, source:c.source, note:$('#s-note').value.trim(), addedBy:S.session});
  U.supp = null; save(); render(); toast('Tankowanie uzupełnione');
}
function exportReport(){
  if(!window.XLSX){ toast('Nie wczytano biblioteki do eksportu. Sprawdź połączenie i odśwież stronę.', true); return; }
  const p = U.period, rows = vehiclesInPeriod(p).map(v => vehReport(v.id, p));
  const a = [['Okres','Samochód','Model','Spółka','Użytkownicy',`Stan na ${lastDay(prevP(p))}`,`Stan na ${lastDay(p)}`,'Przebieg miesiąca (km)','Prywatne zgłoszone (km)','Prywatne uzupełnione (km)','Prywatne razem (km)','Służbowe wyliczone (km)','Udział prywatny (%)','Norma l/100 km','Litry należne','Zatankowane zgłoszone (l)','Zatankowane uzupełnione (l)','Zatankowane razem (l)','Weryfikacja','Uwagi z weryfikacji']];
  rows.forEach(r => a.push([p, r.v.nr, r.v.model, r.v.spolka, r.users.map(x=>x.txt).join(', '), r.start ?? '', r.end ?? '', r.przebieg ?? '', r.kmZgl, r.kmUzup, r.kmPryw, r.sluzb ?? '', r.udzial!=null ? Math.round(r.udzial*1000)/10 : '', r.v.norma, r.nal, r.lZgl, r.lUzup, r.lRazem, r.ver && r.ver.done ? 'zweryfikowany' : 'do weryfikacji', r.ver ? r.ver.note : '']));
  const u = [['Typ','Data','Samochód','Użytkownik','Km','Litry','Licznik start','Licznik koniec','Trasa / uwagi','Źródło ustalenia','Dodał']];
  S.trips.filter(x=>x.okres===p && x.manual).forEach(x => u.push(['Przejazd prywatny', x.date, veh(x.vehicleId).nr, userBy(x.userId).name, x.km, '', x.start ?? '', x.end ?? '', x.trasa, x.source, userBy(x.addedBy) ? userBy(x.addedBy).name : '']));
  S.fuels.filter(x=>x.okres===p && x.manual).forEach(x => u.push(['Tankowanie', x.date, veh(x.vehicleId).nr, userBy(x.userId).name, '', x.litry, '', '', x.note || '', x.source, userBy(x.addedBy) ? userBy(x.addedBy).name : '']));
  const wb = XLSX.utils.book_new();
  const add = (aoa, name, w) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = w.map(x=>({wch:x})); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(a, 'Raport pojazdów', [9,11,24,8,34,14,14,14,14,14,13,14,12,10,11,14,14,13,15,40]);
  add(u, 'Uzupełnienia', [17,11,11,20,8,8,12,12,36,22,18]);
  const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  downloads.save({filename:`ALBA_Raport_pojazdow_${p}.xlsx`, data:new Blob([buf])})
    .then(() => toast('Plik zapisany'))
    .catch(err => { if(err && err.code==='declined') return; toast('Nie udało się zapisać pliku.', true); });
}

function modalDetail(m){
  const p = U.period, closed = isClosed(p), v = veh(m.v), u = userBy(m.u);

    .sort((a,b)=>a.date.localeCompare(b.date));
  const pending = ents.filter(e=>e.status==='Zgłoszony'||e.status==='Zgłoszone').length;

      : `<div class="t">Tankowanie prywatne</div><div class="s">${fDate(e.date)}</div>`;
    const ph = e.photo ? `<button class="thumb ${U.expanded===e.id?'open':''}" data-a="expand" data-id="${e.id}" aria-label="${e.kind==='trip'?'Zdjęcie licznika':'Zdjęcie paragonu'}"><img src="${photoSrc(e)}" alt=""></button>` : '';
    let acts = '';
    if(e.manual){ acts = `<div class="note">Dodane w raporcie pojazdów${e.source?', źródło: '+esc(e.source):''}.</div>`; }
    else if(!closed && isPend){
      acts = U.rejecting===e.id
        ? `<div class="field" style="margin-top:8px"><label for="rej-${e.id}">Powód odrzucenia</label><textarea id="rej-${e.id}" placeholder="np. odczyt licznika nie zgadza się ze zdjęciem"></textarea></div>
           <div class="ent-acts"><button class="btn btn-ghost btn-sm" data-a="rejCancel">Anuluj</button><button class="btn btn-danger btn-sm" data-a="rejDo" data-k="${e.kind}" data-id="${e.id}">Odrzuć wpis</button></div>`
        : `<div class="ent-acts"><button class="btn btn-ok btn-sm" data-a="acc" data-k="${e.kind}" data-id="${e.id}">Akceptuj</button><button class="btn btn-danger btn-sm" data-a="rej" data-id="${e.id}">Odrzuć</button></div>`;
    } else if(!closed && isAcc){

    return `<div class="entry"><div class="ico">${e.kind==='trip'?I.car:I.fuel}</div><div>${main}<span class="pill p-${e.status}">${e.status}</span> ${e.late?'<span class="pill p-late">wpis po terminie</span>':''} ${e.manual?'<span class="pill p-late">uzupełnienie</span>':''}${e.comment?`<div class="comment">${esc(e.comment)}</div>`:''}${ph}${acts}</div><div class="r">${e.kind==='trip'?fKm(e.km)+' km':fL(e.litry)+' l'}</div></div>`;

  const p = U.period, closed = isClosed(p), rows = rowsFor(p);
  const z = [['Okres','Użytkownik','Samochód','Model','Spółka','Licznik początkowy','Licznik końcowy','Stan licznika na koniec miesiąca','Km prywatne','Norma l/100 km','Litry należne','Litry zatankowane','Saldo przeniesione','Saldo końcowe','Status']];
  rows.forEach(r => { const v = veh(r.vehicleId); z.push([p, userBy(r.userId).name, v.nr, v.model, v.spolka, r.licznikStart, r.licznikEnd, r.licznikMiesiac, r.km, r.norma, r.litryNalezne, r.litryZatankowane, r.saldoPrzen, r.saldoKon, closed?'Zamknięte':'Wstępne (okres otwarty)']); });
  const t = [['Data','Użytkownik','Samochód','Licznik start','Licznik koniec','Km','Trasa','Litry wg normy','Status','Wpis po terminie','Komentarz','Uzupełnienie rozliczającego']];
  S.trips.filter(x=>x.okres===p).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x => { const v = veh(x.vehicleId); t.push([x.date, userBy(x.userId).name, v.nr, x.start, x.end, x.km, x.trasa, r2(x.km*v.norma/100), x.status, x.late?'tak':'', x.comment, x.manual?(x.source||'tak'):'']); });
  const f = [['Data','Użytkownik','Samochód','Litry','Paragon','Status','Wpis po terminie','Komentarz']];
  S.fuels.filter(x=>x.okres===p).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x => f.push([x.date, userBy(x.userId).name, veh(x.vehicleId).nr, x.litry, x.manual?'uzupełnienie':(x.photo?'tak':'nie'), x.status, x.late?'tak':'', x.comment]));
  const wb = XLSX.utils.book_new();
  const add = (aoa, name, w) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = w.map(x=>({wch:x})); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(z, 'Zestawienie', [9,20,11,24,8,14,14,16,11,13,12,15,15,13,22]);
  add(t, 'Przejazdy', [11,20,11,12,12,8,34,13,14,14,30,24]);
  add(f, 'Tankowania', [11,20,11,8,9,14,14,30]);
  const ld = lastDay(p), o = [['Samochód','Model','Stan na dzień','Stan licznika (km)','Podał','Data podania']];
  const vids = new Set(S.readings.filter(x=>x.okres===p).map(x=>x.vehicleId).concat(S.assignments.filter(a => a.od<=ld && (!a.do || a.do>=ld)).map(a=>a.vehicleId)));
  [...vids].map(veh).sort((a,b)=>a.nr.localeCompare(b.nr)).forEach(v => { const rd = readingFor(p, v.id); o.push([v.nr, v.model, ld, rd ? rd.licznik : 'brak', rd ? userBy(rd.userId).name : '', rd ? rd.date : '']); });
  add(o, 'Stany liczników', [11,24,12,16,20,12]);
  const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  downloads.save({filename:`ALBA_Przejazdy_prywatne_${p}.xlsx`, data:new Blob([buf])})
    .then(() => toast('Plik zapisany'))
    .catch(err => { if(err && err.code==='declined') return; toast('Nie udało się zapisać pliku.', true); });
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if(!el) return;
  const a = el.dataset.a;
  if(a==='ovClose'){ if(ev.target===el){ U.modal = null; U.rejecting = null; renderModal(); } return; }
  switch(a){
    case 'loginOpen': U.loginOpen = true; renderLogin(); break;
    case 'login': S.session = el.dataset.id; save(); U.view = userBy(el.dataset.id).role==='admin'?'admin':'home'; U.period = null; render(); break;
    case 'logout': S.session = null; U.modal = null; U.loginOpen = true; save(); render(); break;
    case 'reset': { const ses = S.session; S = seed(); S.session = ses; save(); U.modal = null; U.period = null; render(); toast('Dane testowe przywrócone'); break; }
    case 'account': U.modal = {type:'account'}; renderModal(); break;
    case 'theme': { const t = el.dataset.t; if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem(KEY+'-theme', t); }catch(e){} renderModal(); break; }
    case 'go': U.view = el.dataset.v; U.modal = null; render(); window.scrollTo(0,0); break;
    case 'saveTrip': saveTrip(); break;
    case 'saveOdo': saveOdo(); break;
    case 'odoGo': U.odoPreset = {p:el.dataset.p, v:el.dataset.veh}; U.view = 'odo'; render(); window.scrollTo(0,0); break;
    case 'saveFuel': saveFuel(); break;
    case 'del': { const arr = el.dataset.k==='trip' ? S.trips : (el.dataset.k==='odo' ? S.readings : S.fuels); const i = arr.findIndex(x=>x.id===el.dataset.id); if(i>=0){ arr.splice(i,1); save(); toast('Wpis usunięty'); render(); } break; }
    case 'per': { const l = periodList(); U.period = l[l.indexOf(U.period) + Number(el.dataset.d)]; render(); break; }
    case 'detail': U.modal = {type:'detail', u:el.dataset.u, v:el.dataset.veh}; U.rejecting = null; U.expanded = null; renderModal(); break;
    case 'mClose': U.modal = null; U.rejecting = null; renderModal(); break;
    case 'expand': U.expanded = U.expanded===el.dataset.id ? null : el.dataset.id; renderModal(); break;
    case 'acc': { const e = findEntry(el.dataset.k, el.dataset.id); e.status = ACC[el.dataset.k]; e.comment=''; save(); render(); toast('Zaakceptowano'); break; }
    case 'accAll': { const m = U.modal; let n = 0; [['trip',S.trips],['fuel',S.fuels]].forEach(([k,arr]) => arr.forEach(x => { if(x.userId===m.u && x.vehicleId===m.v && x.okres===U.period && x.status===PEN[k]){ x.status = ACC[k]; n++; } })); save(); render(); toast(`Zaakceptowano wpisy: ${n}`); break; }
    case 'rej': U.rejecting = el.dataset.id; renderModal(); setTimeout(()=>{ const t = $('#rej-'+el.dataset.id); if(t) t.focus(); }, 0); break;
    case 'rejCancel': U.rejecting = null; renderModal(); break;
    case 'rejDo': { const t = $('#rej-'+el.dataset.id); const txt = t ? t.value.trim() : ''; if(!txt){ toast('Wpisz powód odrzucenia, aby użytkownik wiedział, co poprawić.', true); if(t) t.focus(); break; }
      const e = findEntry(el.dataset.k, el.dataset.id); e.status = REJ[el.dataset.k]; e.comment = txt; U.rejecting = null; save(); render(); toast('Wpis odrzucony'); break; }
    case 'undo': { const e = findEntry(el.dataset.k, el.dataset.id); e.status = PEN[el.dataset.k]; e.comment = ''; save(); render(); break; }
    case 'closeAsk': U.modal = {type:'close'}; renderModal(); break;
    case 'closeDo': {
      const p = U.period, rows = rowsFor(p), now = today();
      rows.forEach(r => S.settlements.push({okres:p, userId:r.userId, vehicleId:r.vehicleId, licznikStart:r.licznikStart, licznikEnd:r.licznikEnd, licznikMiesiac:r.licznikMiesiac, km:r.km, norma:r.norma, litryNalezne:r.litryNalezne, litryZatankowane:r.litryZatankowane, saldoPrzen:r.saldoPrzen, saldoKon:r.saldoKon, closedAt:now, closedBy:S.session}));
      S.trips.forEach(x => { if(x.okres===p && x.status==='Zaakceptowany') x.status = 'Rozliczony'; });
      S.fuels.forEach(x => { if(x.okres===p && x.status==='Zaakceptowane') x.status = 'Rozliczone'; });
      S.closed.push(p); save(); U.modal = null; render(); toast('Okres zamknięty'); break;
    }
    case 'export': exportXlsx(); break;
    case 'exportReport': exportReport(); break;
    case 'notif': U.modal = {type:'notif'}; renderModal(); break;
    case 'rmode': U.rmode = el.dataset.m; render(); break;
    case 'rpre': rangePreset(el.dataset.k); render(); break;
    case 'exportRange': exportRange(); break;
    case 'vdetail': U.modal = {type:'veh', v:el.dataset.veh}; U.supp = null; renderModal(); break;
    case 'supp': U.supp = el.dataset.k; renderModal(); { const f = document.querySelector('#modal .supp select, #modal .supp input'); if(f) f.focus(); } break;
    case 'suppCancel': U.supp = null; renderModal(); break;
    case 'suppTripDo': suppTrip(); break;
    case 'suppFuelDo': suppFuel(); break;
    case 'suppDel': { const arr = el.dataset.k==='trip' ? S.trips : S.fuels; const i = arr.findIndex(x=>x.id===el.dataset.id && x.manual); if(i>=0){ arr.splice(i,1); save(); render(); toast('Uzupełnienie usunięte'); } break; }
    case 'verDo': {
      const p = U.period, vid = U.modal.v, note = ($('#ver-note')||{}).value || '';
      let x = verifFor(p, vid);
      if(!x){ x = {okres:p, vehicleId:vid, done:false, note:'', by:S.session, date:today()}; S.verif.push(x); }
      x.done = !x.done; x.note = note.trim(); x.by = S.session; x.date = today();
      save(); render(); toast(x.done ? 'Oznaczono jako zweryfikowany' : 'Weryfikacja cofnięta'); break;
    }
    case 'verNote': { const p = U.period, vid = U.modal.v; let x = verifFor(p, vid); if(!x){ x = {okres:p, vehicleId:vid, done:false, note:'', by:S.session, date:today()}; S.verif.push(x); } x.note = ($('#ver-note').value||'').trim(); save(); toast('Uwagi zapisane'); break; }
  }
});
document.addEventListener('change', ev => {
  const id = ev.target.id, val = ev.target.value;
  if(id==='r-from' && val){ U.rfrom = val; render(); }
  else if(id==='r-to' && val){ U.rto = val; render(); }
  else if(id==='r-st'){ U.rst = val; render(); }
});
document.addEventListener('keydown', ev => {
  if(ev.key==='Escape' && U.modal){ U.modal = null; U.rejecting = null; renderModal(); }
  if((ev.key==='Enter' || ev.key===' ') && ev.target.matches('tr[data-a="detail"], tr[data-a="vdetail"]')){ ev.preventDefault(); ev.target.click(); }
});

/* ---------- PWA ---------- */
const APP_VERSION = '0.1';
async function saveFile({filename, data}){
  const blob = data instanceof Blob ? data : new Blob([data]);
  const file = new File([blob], filename, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  if(matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:filename}); return {status:'saved'}; }
    catch(e){ if(e && e.name==='AbortError') throw {code:'declined'}; }
  }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return {status:'saved'};
}
downloads = {save: saveFile};
let deferredPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
function installBlock(){
  if(isStandalone()) return '<div class="note">Aplikacja jest zainstalowana na tym urządzeniu.</div>';
  if(deferredPrompt) return '<button class="btn btn-ghost" data-a="install">Zainstaluj aplikację na telefonie</button>';
  if(isIOS()) return '<div class="note">Instalacja na iPhonie: otwórz stronę w Safari, stuknij Udostępnij, a potem „Do ekranu początkowego”.</div>';
  return '<div class="note">Instalacja: w menu przeglądarki wybierz „Zainstaluj aplikację” lub „Dodaj do ekranu głównego”.</div>';
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; me() ? renderModal() : renderLogin(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('Aplikacja zainstalowana'); });
window.addEventListener('offline', () => toast('Brak połączenia. Aplikacja działa dalej, dane zapisują się na telefonie.', true));
window.addEventListener('online', () => toast('Połączenie przywrócone'));
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  let wantReload = false;
  const show = w => { U.waiting = w; $('#upd').innerHTML = '<div class="upd"><span>Dostępna nowa wersja aplikacji.</span><button class="btn btn-ok btn-sm" data-a="upd">Odśwież</button></div>'; };
  navigator.serviceWorker.register('sw.js').then(reg => {
    if(reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound', () => { const nw = reg.installing; nw && nw.addEventListener('statechange', () => { if(nw.state==='installed' && navigator.serviceWorker.controller) show(nw); }); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(U.updRequested && !wantReload){ wantReload = true; location.reload(); } });
}
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a="install"],[data-a="upd"]');
  if(!el) return;
  if(el.dataset.a==='install' && deferredPrompt){ deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt = null; me() ? renderModal() : renderLogin(); }
  if(el.dataset.a==='upd' && U.waiting){ U.updRequested = true; U.waiting.postMessage('SKIP_WAITING'); $('#upd').innerHTML = ''; }
});

(function init(){
  try{ const t = localStorage.getItem(KEY+'-theme'); if(t && t!=='auto') document.documentElement.setAttribute('data-theme', t); }catch(e){}
  if(S.session && !userBy(S.session)) S.session = null;
  render();
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  registerSW();
})();
</script>
